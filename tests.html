<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Tests</title>
  <style>
    :root { --bg: #faf7f5; --text: #1f1d1c; --muted: #6b6662; --pass: #2f8a5b; --fail: #c8463d; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161514; --text: #f2efed; --muted: #a39d98; --pass: #4fbf86; --fail: #e8675d; } }
    body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font-family: system-ui, "Segoe UI", sans-serif; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    #summary { margin: 0 0 20px; font-weight: 600; }
    #summary.pass { color: var(--pass); } #summary.fail { color: var(--fail); }
    ul { list-style: none; padding: 0; margin: 0; }
    li { padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--muted) 25%, transparent); }
    .pass::before { content: "✓ "; color: var(--pass); font-weight: 700; }
    .fail::before { content: "✗ "; color: var(--fail); font-weight: 700; }
    .err { display: block; margin-top: 4px; color: var(--fail); font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Pomodoro tests</h1>
    <p id="summary">Running…</p>
    <ul id="results"></ul>
  </main>

  <script src="timer.js"></script>
  <script src="tests.js"></script>
  <script>
    const tests = window.PomodoroTests;
    // ---- Run and show results ----
    let failed = 0;
    const list = document.getElementById("results");
    for (const { name, fn } of tests) {
      const li = document.createElement("li");
      li.textContent = name;
      try { fn(); li.className = "pass"; }
      catch (e) {
        failed++; li.className = "fail";
        const err = document.createElement("span"); err.className = "err"; err.textContent = e.message;
        li.appendChild(err);
      }
      list.appendChild(li);
    }
    const summary = document.getElementById("summary");
    summary.textContent = failed ? `${failed} of ${tests.length} failed` : `All ${tests.length} tests passed`;
    summary.className = failed ? "fail" : "pass";
    document.title = (failed ? "✗ " : "✓ ") + "Pomodoro Tests";
  </script>
</body>
</html>
